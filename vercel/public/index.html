<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0B0F14" />
<title>SMC FX Analyzer</title>
<link rel="manifest" href="/manifest.json" />
<link rel="apple-touch-icon" href="/icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="stylesheet" href="/styles.css" />
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="ladder" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
    <span class="brand-name">SMC&nbsp;FX</span>
  </div>
  <button id="settingsBtn" class="icon-btn" aria-label="Settings">⚙</button>
</header>

<main>

  <section class="uploads">
    <div class="upload-card" id="htfCard">
      <div class="upload-label">
        <span class="tag tag-htf">HTF</span>
        <span>Higher timeframe — market bias</span>
      </div>
      <label class="drop" for="htfInput">
        <img id="htfPreview" class="preview" hidden />
        <span class="drop-empty">Tap to add chart<br /><small>e.g. 4H / Daily</small></span>
      </label>
      <input id="htfInput" type="file" accept="image/*" capture="environment" hidden />
    </div>

    <div class="upload-card" id="ltfCard">
      <div class="upload-label">
        <span class="tag tag-ltf">LTF</span>
        <span>Lower timeframe — entry trigger</span>
      </div>
      <label class="drop" for="ltfInput">
        <img id="ltfPreview" class="preview" hidden />
        <span class="drop-empty">Tap to add chart<br /><small>e.g. 5M / 15M</small></span>
      </label>
      <input id="ltfInput" type="file" accept="image/*" capture="environment" hidden />
    </div>
  </section>

  <section class="meta-inputs">
    <input id="pairInput" type="text" placeholder="Pair (e.g. EURUSD) — optional" autocomplete="off" />
    <textarea id="noteInput" placeholder="Anything else the AI should know? (optional)" rows="2"></textarea>
  </section>

  <button id="analyzeBtn" class="primary-btn" disabled>Analyze setup</button>
  <p id="statusMsg" class="status" role="status"></p>

  <section id="results" class="results" hidden>
    <div class="result-header">
      <span id="biasBadge" class="badge"></span>
      <span id="recBadge" class="badge"></span>
      <span id="confBadge" class="badge badge-outline"></span>
    </div>

    <div class="result-block">
      <h3>HTF bias</h3>
      <p id="htfNotes"></p>
    </div>

    <div class="result-block">
      <h3>LTF setup</h3>
      <p id="ltfSetup"></p>
    </div>

    <div class="levels" id="levelsGrid">
      <div class="level"><span class="level-label">Entry</span><span class="level-value" id="entryVal">—</span></div>
      <div class="level"><span class="level-label">Stop loss</span><span class="level-value sl" id="slVal">—</span></div>
      <div class="level"><span class="level-label">TP 1</span><span class="level-value tp" id="tp1Val">—</span></div>
      <div class="level"><span class="level-label">TP 2</span><span class="level-value tp" id="tp2Val">—</span></div>
      <div class="level"><span class="level-label">R:R</span><span class="level-value" id="rrVal">—</span></div>
    </div>

    <div class="result-block">
      <h3>Invalidation</h3>
      <p id="invalText"></p>
    </div>

    <p class="disclaimer" id="disclaimerText"></p>
  </section>

</main>

<dialog id="settingsDialog">
  <form method="dialog" class="settings-form">
    <h2>Settings</h2>
    <label for="apiKeyInput">Anthropic API key</label>
    <input id="apiKeyInput" type="password" placeholder="sk-ant-..." autocomplete="off" />
    <p class="hint">Stored only in this browser (localStorage). Sent directly to your own server, never to a third party.</p>
    <div class="settings-actions">
      <button value="cancel" class="secondary-btn">Cancel</button>
      <button id="saveSettingsBtn" value="default" class="primary-btn">Save</button>
    </div>
  </form>
</dialog>

<script src="/app.js"></script>
</body>
</html>
